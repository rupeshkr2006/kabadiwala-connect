<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b49"><title>Kabadiwala Connect — Admin</title><link rel="stylesheet" href="./styles.css"><style>
body{margin:0;background:#f7faf8;color:#10251c;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.admin-wrap{max-width:1280px;margin:0 auto;padding:24px}.admin-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.admin-top h1{margin:0}.sub,.muted{color:#64756d;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.card{background:white;border:1px solid #dce7e1;border-radius:14px;padding:16px}.card h3{margin:0 0 8px;font-size:13px;color:#64756d}.card strong{font-size:26px}.section{margin:22px 0}.section h2{font-size:19px}.recycler{margin:12px 0}.rhead{display:flex;justify-content:space-between;gap:12px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;background:#e9f6ef;color:#176b49;font-weight:700;font-size:12px}.pending{background:#fff4df;color:#8a5a00}.docs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.doc-grid{display:grid;gap:7px;width:100%;margin-top:8px}.doc-status{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #dce7e1;border-radius:9px;padding:7px 9px;background:#f8fbf9}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;background:#176b49;color:white}.btn.secondary{background:white;color:#176b49;border:1px solid #b9d2c5}.btn.danger{background:#9b3434}.verify-actions{display:flex;gap:8px;margin-top:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{padding:10px;border-bottom:1px solid #e2ebe6;text-align:left;font-size:12px;white-space:nowrap}.login{max-width:440px;margin:80px auto}.error{color:#9b3434;margin-top:10px}input,select{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #cddad4;border-radius:9px;box-sizing:border-box;background:white}label{font-size:12px;font-weight:700;color:#43574e}.market-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.market-msg{margin:10px 0 0}.market-use{border:1px solid #b9d2c5;background:white;color:#176b49;border-radius:8px;padding:6px 9px;font-weight:700;cursor:pointer}@media(max-width:800px){.grid,.market-form{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid,.market-form{grid-template-columns:1fr}.admin-wrap{padding:14px}}
</style></head><body><div id="root"></div><script>
const root=document.getElementById("root");
const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=v=>"₹"+Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2});
async function post(path,body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.detail||"Request failed");return j}
async function get(path){const r=await fetch(path,{credentials:"same-origin",cache:"no-store"});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.detail||"Request failed");return j}
function login(){root.innerHTML='<main class="login"><div class="card"><p class="sub">KABADIWALA CONNECT</p><h1>Admin Login</h1><p class="sub">Admin account: 9990000000 · Demo OTP: 123456</p><label>Mobile number<input id="phone" inputmode="numeric" maxlength="10" value="9990000000"></label><label>OTP<input id="otp" inputmode="numeric" maxlength="6" value="123456"></label><button class="btn" id="loginBtn" style="margin-top:8px">Sign in as Admin</button><div id="err" class="error"></div></div></main>';document.getElementById("loginBtn").onclick=async()=>{try{await post("/api/session",{phone:document.getElementById("phone").value.replace(/\D/g,""),otp:document.getElementById("otp").value.trim(),role:"admin"});await load()}catch(e){document.getElementById("err").textContent=e.message}}}
function table(rows,cols){if(!rows.length)return '<div class="sub">No records.</div>';return '<table class="table"><thead><tr>'+cols.map(c=>'<th>'+h(c[0])+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+h(typeof c[1]==="function"?c[1](r):(r[c[1]]??"—"))+'</td>').join("")+'</tr>').join("")+'</tbody></table>'}
async function load(){root.innerHTML='<div class="admin-wrap"><p class="sub">Loading admin panel…</p></div>';try{render(await get("/api/admin?action=overview"))}catch(e){root.innerHTML='<main class="login"><div class="card"><h1>Admin access</h1><p class="error">'+h(e.message)+'</p><button class="btn" onclick="login()">Back to login</button></div></main>'}}
function render(d){const s=d.summary||{},market=d.market||[];root.innerHTML='<div class="admin-wrap"><div class="admin-top"><div><p class="sub">KABADIWALA CONNECT</p><h1>Admin Control Panel</h1><p class="sub">Verify recyclers, inspect all platform records and control the official market price board.</p></div><button class="btn secondary" id="refresh">↻ Refresh</button></div><div class="grid">'+[['Collectors',s.collectors],['Recyclers',s.recyclers],['Pending verification',s.pending_recycler_verification],['Verified recyclers',s.verified_recyclers],['Requests / lots',s.lots],['Offers',s.offers],['Transactions',s.transactions],['Earnings',s.earnings]].map(x=>'<div class="card"><h3>'+h(x[0])+'</h3><strong>'+Number(x[1]||0)+'</strong></div>').join("")+'</div><section class="section"><h2>🛡 Recycler verification</h2>'+((d.recyclers||[]).map(recycler).join("")||'<div class="card">No recycler accounts yet.</div>')+'</section><section class="section"><h2>👥 User management</h2><div class="card table-wrap"><p class="sub">Admin can deactivate collector and recycler accounts. Their platform transaction history is retained.</p><div id="users"><h3>Collectors</h3>'+userTable(d.all_collectors&&d.all_collectors.length?d.all_collectors:(d.collectors||[]))+'<h3>Recyclers</h3>'+userTable(d.all_recyclers&&d.all_recyclers.length?d.all_recyclers:(d.recyclers||[]))+'</div></div></section><section class="section"><h2>₹ Official market prices</h2><div class="card"><p class="sub">Enter the real market items and prices that should be shown to every collector and recycler. Publishing a new price keeps the previous observation in history.</p><form id="marketForm" class="market-form"><label>Market item<input id="name" required placeholder="Copper wire"></label><label>Sub-category<input id="sub" placeholder="Bare bright copper"></label><label>City<input id="city" value="Vijayawada"></label><label>State<input id="state" value="Andhra Pradesh"></label><label>Buying price<input id="buy" type="number" min="0" step="0.01" required></label><label>Selling price<input id="sell" type="number" min="0" step="0.01"></label><label>Market minimum<input id="min" type="number" min="0" step="0.01"></label><label>Market maximum<input id="max" type="number" min="0" step="0.01"></label><label>Unit<select id="unit"><option>kg</option><option>piece</option><option>ton</option></select></label><label style="grid-column:span 2">Source / note<input id="source" value="Admin verified market price"></label><div style="display:flex;gap:8px;align-items:end"><button class="btn" type="submit" id="save">Publish price</button><button class="btn secondary" type="button" id="clear">Clear</button></div></form><p id="msg" class="market-msg sub">Market data is shared through the existing market API.</p></div><div class="card table-wrap" style="margin-top:12px">'+marketTable(market)+'</div></section><section class="section"><h2>📊 All platform data</h2><div class="card table-wrap"><h3>Collectors</h3>'+table(d.collectors||[],[['Phone','phone'],['Name','name'],['Language','preferred_language'],['Location','general_location'],['Active',r=>r.active]])+'</div><div class="card table-wrap"><h3>Recyclers</h3>'+table(d.recyclers||[],[['Phone','phone'],['Name','name'],['Business','business_name'],['Location','general_location'],['Verification','verification_status'],['Badge','verification_badge'],['Email','contact_email']])+'</div><div class="card table-wrap"><h3>Requests / lots</h3>'+table(d.lots||[],[['Lot','lot_reference'],['Collector','collector_phone'],['Material','material_category'],['Weight','approximate_weight_kg'],['Quoted','quoted_value'],['Final','final_sale_value'],['Status','status'],['Collected','collected_at']])+'</div><div class="card table-wrap"><h3>Offers</h3>'+table(d.offers||[],[['Lot','lot_reference'],['Role','actor_role'],['Actor','actor_ref'],['Price','price'],['Time','created_at']])+'</div><div class="card table-wrap"><h3>Transactions</h3>'+table(d.transactions||[],[['Transaction','transaction_reference'],['Lot','lot_reference'],['Collector','collector_phone'],['Recycler','recycler_external_id'],['Quoted','quoted_price'],['Final','final_price'],['Payment','payment_status'],['Status','status']])+'</div><div class="card table-wrap"><h3>Handovers</h3>'+table(d.handovers||[],[['Transaction','transaction_reference'],['Handover','handover_reference'],['Weight','actual_weight_kg'],['Collector confirmed','collector_confirmed'],['Recycler confirmed','recycler_confirmed'],['Time','handover_at']])+'</div><div class="card table-wrap"><h3>Earnings</h3>'+table(d.earnings||[],[['Transaction','transaction_reference'],['Collector','collector_phone'],['Amount',x=>money(x.amount)],['Status','status'],['Method','payment_method'],['Paid','paid_at']])+'</div></section></div>';
document.getElementById("refresh").onclick=load;
document.getElementById("clear").onclick=()=>clearForm();
document.getElementById("marketForm").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg"),b=document.getElementById("save");b.disabled=true;m.textContent="Publishing…";try{await post("/api/admin?action=save-market-item",{material_name:val("name"),sub_category:val("sub"),city:val("city"),state:val("state"),buying_price:val("buy"),selling_price:val("sell"),market_min:val("min"),market_max:val("max"),unit:val("unit"),source:val("source")});m.textContent="✓ Published to the official market board.";clearForm();await load()}catch(e){m.textContent="⚠ "+e.message}finally{b.disabled=false}};
document.querySelectorAll(".market-use").forEach(b=>b.onclick=()=>fillMarket(market[Number(b.dataset.i)]));
document.querySelectorAll("[data-decision]").forEach(b=>b.onclick=async()=>{if(!confirm(b.dataset.decision+" this recycler?"))return;try{await post("/api/admin?action=verify-recycler",{phone:b.dataset.phone,decision:b.dataset.decision,note:"Reviewed in admin panel"});await load()}catch(e){alert(e.message)}});
document.querySelectorAll("[data-doc]").forEach(b=>b.onclick=async()=>{try{const j=await post("/api/admin?action=document-url",{phone:b.dataset.phone,path:b.dataset.path});window.open(j.url,"_blank","noopener")}catch(e){alert(e.message)}});document.querySelectorAll("[data-delete-user]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete/deactivate this user account? Their platform history will be retained."))return;try{await post("/api/admin?action=delete-user",{phone:b.dataset.deleteUser});await load()}catch(e){alert(e.message)}});document.querySelectorAll("[data-restore-user]").forEach(b=>b.onclick=async()=>{if(!confirm("Restore this user account?"))return;try{await post("/api/admin?action=set-user-active",{phone:b.dataset.restoreUser,active:true});await load()}catch(e){alert(e.message)}})}
function userTable(rows){if(!rows.length)return '<div class="sub">No users.</div>';return '<table class="table"><thead><tr><th>Role</th><th>Phone</th><th>Name / Business</th><th>Status</th><th>Verification</th><th>Action</th></tr></thead><tbody>'+rows.map(r=>{const active=r.active!==false;const role=r.role||(r.business_name?"recycler":"collector");return '<tr><td>'+h(role)+'</td><td>'+h(r.phone)+'</td><td>'+h(r.business_name||r.name||"—")+'</td><td>'+h(active?"Active":"Deleted")+'</td><td>'+h(role==="recycler"?(r.verification_status||"pending"):"—")+'</td><td>'+(active?'<button class="btn danger" data-delete-user="'+h(r.phone)+'">Delete / deactivate</button>':'<button class="btn" data-restore-user="'+h(r.phone)+'">Restore</button>')+'</td></tr>'}).join("")+'</tbody></table>'}
function val(id){return document.getElementById(id).value}
function clearForm(){["name","sub","buy","sell","min","max"].forEach(id=>document.getElementById(id).value="");document.getElementById("city").value="Vijayawada";document.getElementById("state").value="Andhra Pradesh";document.getElementById("unit").value="kg";document.getElementById("source").value="Admin verified market price"}
function fillMarket(m){if(!m)return;document.getElementById("name").value=m.material_name||"";document.getElementById("sub").value=m.sub_category||"";document.getElementById("city").value=m.city||"Vijayawada";document.getElementById("state").value=m.state||"Andhra Pradesh";document.getElementById("buy").value=m.buying_price??"";document.getElementById("sell").value=m.selling_price??"";document.getElementById("min").value=m.market_min??"";document.getElementById("max").value=m.market_max??"";document.getElementById("unit").value=m.unit||"kg";document.getElementById("source").value=m.source||"Admin verified market price";window.scrollTo({top:0,behavior:"smooth"})}
function recycler(x){const v=x.verification_badge||x.verification_status==="verified",docs=Array.isArray(x.recycler_documents)?x.recycler_documents:[],types=[["authorization","E-waste authorization",true],["registration","Business / registration certificate",true],["address_proof","Facility / address proof",true],["gst","GST certificate",false]];const docView=types.map(t=>{const d=docs.find(q=>String(q?.document_type||"")===t[0]);return '<div class="doc-status"><span><b>'+h(t[1])+'</b> <small class="sub">'+(t[2]?"Required":"Optional")+'</small></span>'+(d?'<button class="btn secondary" data-doc="1" data-phone="'+h(x.phone)+'" data-path="'+h(d.path)+'">📄 Open '+h(d.file_name||"document")+'</button>':'<span class="sub">'+(t[2]?"Missing":"Not submitted")+'</span>')+'</div>'}).join("");return '<article class="card recycler"><div class="rhead"><div><h3>'+h(x.business_name||x.name||"Recycler")+(v?' <span class="badge">★ Verified</span>':'')+'</h3><div class="sub">+91 '+h(x.phone)+' · '+h(x.name)+'</div></div><span class="badge '+(v?'':'pending')+'">'+h(x.verification_status||"pending")+'</span></div><p>'+h(x.facility_address||x.general_location||"")+'</p><div class="sub"><b>Materials:</b> '+h((x.accepted_materials||[]).join(", "))+' · <b>Registration:</b> '+h(x.registration_number||"—")+' · <b>GST:</b> '+h(x.gst_number||"—")+' · <b>Authorization:</b> '+h(x.authorization_number||"—")+'</div><div class="docs"><strong>Documents</strong><div class="doc-grid">'+docView+'</div></div><div class="verify-actions">'+(!v?'<button class="btn" data-decision="verify" data-phone="'+h(x.phone)+'">★ Verify & badge</button><button class="btn danger" data-decision="reject" data-phone="'+h(x.phone)+'">Reject</button>':'<button class="btn secondary" data-decision="suspend" data-phone="'+h(x.phone)+'">Suspend</button><button class="btn danger" data-delete-user="'+h(x.phone)+'">Delete user</button>')+'</div></article>'}
function marketTable(rows){if(!rows.length)return '<div class="sub">No market prices published yet.</div>';return '<table class="table"><thead><tr><th>Item</th><th>Sub-category</th><th>Location</th><th>Buy</th><th>Sell</th><th>Range</th><th>Unit</th><th>Source</th><th>Updated</th><th></th></tr></thead><tbody>'+rows.map((m,i)=>'<tr><td>'+h(m.material_name)+'</td><td>'+h(m.sub_category||"—")+'</td><td>'+h((m.city||"")+" / "+(m.state||""))+'</td><td>'+money(m.buying_price)+'</td><td>'+money(m.selling_price)+'</td><td>'+money(m.market_min)+' – '+money(m.market_max)+'</td><td>'+h(m.unit||"kg")+'</td><td>'+h(m.source||"Admin")+'</td><td>'+h(m.observed_at?new Date(m.observed_at).toLocaleString("en-IN"):"—")+'</td><td><button class="market-use" data-i="'+i+'">Edit</button></td></tr>').join("")+'</tbody></table>'}
login();
</script></body></html>

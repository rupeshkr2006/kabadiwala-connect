<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b49"><title>Kabadiwala Connect — Admin</title>
<link rel="stylesheet" href="./styles.css">
<style>
body{margin:0;background:#f7faf8;color:#10251c;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.admin-wrap{max-width:1200px;margin:0 auto;padding:24px}.admin-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.admin-top h1{margin:0}.sub{color:#64756d;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.card{background:white;border:1px solid #dce7e1;border-radius:14px;padding:16px}.card h3{margin:0 0 8px;font-size:13px;color:#64756d}.card strong{font-size:26px}.section{margin:18px 0}.section h2{font-size:19px}.recycler{margin:12px 0}.rhead{display:flex;justify-content:space-between;gap:12px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;background:#e9f6ef;color:#176b49;font-weight:700;font-size:12px}.pending{background:#fff4df;color:#8a5a00}.rejected{background:#ffe9e9;color:#8d2c2c}.docs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;background:#176b49;color:white}.btn.secondary{background:white;color:#176b49;border:1px solid #b9d2c5}.btn.danger{background:#9b3434}.verify-actions{display:flex;gap:8px;margin-top:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{padding:10px;border-bottom:1px solid #e2ebe6;text-align:left;font-size:12px;white-space:nowrap}.login{max-width:440px;margin:80px auto}.error{color:#9b3434;margin-top:10px}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.admin-wrap{padding:14px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const root=document.getElementById("root");
const h=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=v=>"₹"+Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2});
async function post(path,body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.detail||"Request failed");return j}
async function get(path){const r=await fetch(path,{credentials:"same-origin",cache:"no-store"});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.detail||"Request failed");return j}
function login(){root.innerHTML='<main class="login"><div class="card"><p class="sub">KABADIWALA CONNECT</p><h1>Admin Login</h1><p class="sub">Use the platform admin account.</p><label>Mobile number<input id="phone" inputmode="numeric" maxlength="10" value="9990000000" style="display:block;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #cddad4;border-radius:9px;box-sizing:border-box"></label><label>OTP<input id="otp" inputmode="numeric" maxlength="6" value="123456" style="display:block;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #cddad4;border-radius:9px;box-sizing:border-box"></label><button class="btn" id="loginBtn">Sign in as Admin</button><div id="err" class="error"></div></div></main>';document.getElementById("loginBtn").onclick=async()=>{const err=document.getElementById("err");err.textContent="";try{const p=document.getElementById("phone").value.replace(/\D/g,""),o=document.getElementById("otp").value.trim();await post("/api/session",{phone:p,otp:o,role:"admin"});await load();}catch(e){err.textContent=e.message}}}
async function load(){root.innerHTML='<div class="admin-wrap"><div class="admin-top"><div><p class="sub">KABADIWALA CONNECT</p><h1>Admin Panel</h1><p class="sub">Recycler verification and platform monitoring</p></div><button class="btn secondary" id="refresh">Refresh</button></div><div id="msg" class="sub">Loading…</div></div>';try{const d=await get("/api/admin?action=overview");render(d)}catch(e){root.innerHTML='<main class="login"><div class="card"><h1>Admin access</h1><p class="error">'+h(e.message)+'</p><button class="btn" onclick="login()">Back to login</button></div></main>'}}
function render(d){const s=d.summary||{};root.innerHTML='<div class="admin-wrap"><div class="admin-top"><div><p class="sub">KABADIWALA CONNECT</p><h1>Admin Panel</h1><p class="sub">Review recycler verification and monitor all platform activity.</p></div><button class="btn secondary" id="refresh">↻ Refresh</button></div><div class="grid">'+[['Collectors',s.collectors],['Recyclers',s.recyclers],['Pending verification',s.pending_recycler_verification],['Verified recyclers',s.verified_recyclers],['Requests / lots',s.lots],['Offers',s.offers],['Transactions',s.transactions],['Earnings',s.earnings]].map(x=>'<div class="card"><h3>'+h(x[0])+'</h3><strong>'+Number(x[1]||0)+'</strong></div>').join("")+'</div><section class="section"><h2>♟ Recycler verification</h2><div>'+((d.recyclers||[]).map(recycler).join("")||'<div class="card">No recycler accounts yet.</div>')+'</div></section><section class="section"><h2>All requests</h2><div class="table-wrap card">'+table(d.lots||[],[['Lot','lot_reference'],['Collector','collector_phone'],['Material','material_category'],['Weight','approximate_weight_kg'],['Quoted','quoted_value'],['Final','final_sale_value'],['Status','status']])+'</div></section><section class="section"><h2>All transactions</h2><div class="table-wrap card">'+table(d.transactions||[],[['Transaction','transaction_reference'],['Lot','lot_reference'],['Collector','collector_phone'],['Recycler','recycler_external_id'],['Quoted','quoted_price'],['Final','final_price'],['Payment','payment_status'],['Status','status']])+'</div></section><section class="section"><h2>All earnings</h2><div class="table-wrap card">'+table(d.earnings||[],[['Transaction','transaction_reference'],['Collector','collector_phone'],['Amount',x=>money(x.amount)],['Status','status'],['Method','payment_method'],['Paid','paid_at']])+'</div></section></div>';document.getElementById("refresh").onclick=load;document.querySelectorAll("[data-decision]").forEach(b=>b.onclick=async()=>{if(!confirm(b.dataset.decision+" this recycler?"))return;try{await post("/api/admin?action=verify-recycler",{phone:b.dataset.phone,decision:b.dataset.decision,note:"Reviewed in admin panel"});await load()}catch(e){alert(e.message)}});document.querySelectorAll("[data-doc]").forEach(b=>b.onclick=async()=>{try{const j=await post("/api/admin?action=document-url",{phone:b.dataset.phone,path:b.dataset.path});window.open(j.url,"_blank","noopener")}catch(e){alert(e.message)}})}
function recycler(x){const verified=x.verification_badge||x.verification_status==="verified";const docs=Array.isArray(x.recycler_documents)?x.recycler_documents:[];return '<article class="card recycler"><div class="rhead"><div><h3>'+h(x.business_name||x.name||"Recycler")+(verified?' <span class="badge">★ Verified</span>':'')+'</h3><div class="sub">+91 '+h(x.phone)+' · '+h(x.name)+'</div></div><span class="badge '+(verified?"":"pending")+'">'+h(x.verification_status||"pending")+'</span></div><p>'+h(x.facility_address||x.general_location||"")+'</p><div class="sub"><b>Materials:</b> '+h((x.accepted_materials||[]).join(", "))+' · <b>Registration:</b> '+h(x.registration_number||"—")+' · <b>GST:</b> '+h(x.gst_number||"—")+' · <b>Authorization:</b> '+h(x.authorization_number||"—")+'</div><div class="docs"><strong>Documents:</strong> '+(docs.length?docs.map(d=>'<button class="btn secondary" data-doc="1" data-phone="'+h(x.phone)+'" data-path="'+h(d.path)+'">📄 '+h(d.file_name||d.document_type)+'</button>').join(""):'<span class="sub">None uploaded</span>')+'</div><div class="verify-actions">'+(!verified?'<button class="btn" data-decision="verify" data-phone="'+h(x.phone)+'">★ Verify & badge</button><button class="btn danger" data-decision="reject" data-phone="'+h(x.phone)+'">Reject</button>':'<button class="btn secondary" data-decision="suspend" data-phone="'+h(x.phone)+'">Suspend</button>')+'</div></article>'}
function table(rows,cols){if(!rows.length)return '<div class="sub">No records.</div>';return '<table class="table"><thead><tr>'+cols.map(c=>'<th>'+h(c[0])+'</th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+h(typeof c[1]==="function"?c[1](r):(r[c[1]]??"—"))+'</td>').join("")+'</tr>').join("")+'</tbody></table>'}
login();
</script>
</body>
</html>

name: Build Kabadiwala Connect Android APK

on:
  push:
    branches: ["main", "native-apk-final"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install

      - name: Prepare bundled web app
        run: |
          rm -rf www
          mkdir -p www
          cp -R public/. www/

      - name: Require bundled e-waste model
        run: |
          test -f android-model/ewaste_mobilenetv2_fp16.tflite
          test "$(stat -c%s android-model/ewaste_mobilenetv2_fp16.tflite)" -gt 1000000
          echo "Bundled model size: $(stat -c%s android-model/ewaste_mobilenetv2_fp16.tflite) bytes"

      - name: Add Android platform
        run: npx cap add android

      - name: Install native classifier
        run: |
          mkdir -p android/app/src/main/java/com/kabadiwalaconnect/app
          cp android-native/WasteClassifierPlugin.java android/app/src/main/java/com/kabadiwalaconnect/app/WasteClassifierPlugin.java
          mkdir -p android/app/src/main/assets
          cp android-model/ewaste_mobilenetv2_fp16.tflite android/app/src/main/assets/ewaste_mobilenetv2_fp16.tflite

      - name: Configure TensorFlow Lite runtime and plugin registration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          s = gradle.read_text()
          dep = 'implementation "org.tensorflow:tensorflow-lite:2.17.0"'
          if dep not in s:
              marker = "dependencies {"
              s = s.replace(marker, marker + "\n    " + dep, 1)
          gradle.write_text(s)

          main = Path("android/app/src/main/java/com/kabadiwalaconnect/app/MainActivity.java")
          s = main.read_text()
          if "WasteClassifierPlugin" not in s:
              s = s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.kabadiwalaconnect.app.WasteClassifierPlugin;")
              s = s.replace(
                  "public class MainActivity extends BridgeActivity {",
                  "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        registerPlugin(WasteClassifierPlugin.class);\n    }"
              )
          main.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify model is inside APK
        working-directory: android
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/ewaste_mobilenetv2_fp16.tflite'
          test "$(unzip -p app/build/outputs/apk/debug/app-debug.apk assets/ewaste_mobilenetv2_fp16.tflite | sha256sum | cut -d' ' -f1)" = "$(sha256sum ../android-model/ewaste_mobilenetv2_fp16.tflite | cut -d' ' -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kabadiwala-Connect-final-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
